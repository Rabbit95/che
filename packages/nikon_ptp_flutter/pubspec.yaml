name: nikon_ptp_flutter
description: Flutter-side transport implementations for the nikon_ptp protocol package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

resolution: workspace

dependencies:
  bonsoir: ^5.1.10
  flutter:
    sdk: flutter
  nikon_ptp:
    path: ../nikon_ptp
  quick_usb: ^0.4.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.0
  pigeon: ^22.4.2

# M6b — iOS ImageCaptureCore (ICCameraDevice) bridge. Android USB stays pure-Dart
# (goes through quick_usb_patched, no platform-channel needed at this layer).
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IccPtpPlugin
        sharedDarwinSource: false
