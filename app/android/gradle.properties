# Disable Kotlin incremental compilation.
# Reason: pub cache lives on C:\ but the project is on D:\, and Kotlin's
# RelocatableFileToPathConverter throws IllegalArgumentException when the
# incremental cache tries to compute a relative path across drive roots
# (kotlin.io.FilesKt__UtilsKt.toRelativeString: "different roots").
# Non-incremental builds are slower but reliable in this layout.
kotlin.incremental=false