name: nikon_z_control
description: Nikon Z-series mobile control app (Wi-Fi + USB).
publish_to: none
version: 0.3.7+10

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

resolution: workspace

dependencies:
  bonsoir: ^5.1.10
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  nikon_ptp:
    path: ../packages/nikon_ptp
  nikon_ptp_flutter:
    path: ../packages/nikon_ptp_flutter
  photo_manager: ^3.6.4
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.3.2

dev_dependencies:
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
